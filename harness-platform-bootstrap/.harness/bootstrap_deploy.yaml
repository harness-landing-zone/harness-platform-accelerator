pipeline:
  name: Harness Accelerator Bootstrap
  identifier: bootstrap_deploy
  projectIdentifier: platform_management
  orgIdentifier: harness_platform_accelerator
  tags: {}
  properties:
    ci:
      codebase:
        connectorRef: org.platform_configs
        repoName: harness-platform-accelerator
        build: <+input>
  variables:
    - name: tofu_action
      type: String
      description: tofu action to execute
      required: true
      value: <+input>.allowedValues(plan,apply,destroy)
    - name: s3_bucket
      type: String
      description: S3 bucket name for tofu remote state storage
      required: true
      value: <+input>.default(harness-backend-mk)
    - name: aws_region
      type: String
      description: AWS region for the S3 state backend and STS
      required: true
      value: <+input>.default(us-east-1)
    - name: aws_role_arn
      type: String
      description: IAM role ARN to assume via OIDC for S3 backend access
      required: true
      value: <+input>
    - name: github_app_application_id
      type: String
      description: GitHub App application ID (non-sensitive) for the platform_configs connector
      required: false
      value: <+input>.default(2780955)
    - name: github_app_installation_id
      type: String
      description: GitHub App installation ID (non-sensitive) for the platform_configs connector
      required: false
      value: <+input>.default(107783082)
    - name: github_app_private_key_ref
      type: String
      description: Harness secret ref for the GitHub App PEM key (e.g. org.platform_configs_github_app_key)
      required: false
      value: <+input>.default(org.platform_configs_github_app_key)
    - name: hanrness_platform_endpoint
      type: String
      description: Endpoint URL for the Harness Platform API (e.g. https://app.harness.io/gateway). Only needed if using a self-hosted or custom domain instance.
      required: false
      value: <+input>.default(https://app.harness.io/gateway)
  stages:
    - stage:
        name: Bootstrap Plan
        identifier: bootstrap_plan
        description: Clone repo, run tofu plan, upload plan to S3
        type: CI
        spec:
          cloneCodebase: true
          caching:
            enabled: true
            override: true
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
          execution:
            steps:
              - step:
                  type: Plugin
                  name: AWS OIDC Token
                  identifier: aws_oidc_token_plan
                  spec:
                    connectorRef: account.harnessImage
                    image: plugins/aws-oidc
                    settings:
                      role_arn: <+pipeline.variables.aws_role_arn>
                      aws_region: <+pipeline.variables.aws_region>
                      duration: 3600
                  timeout: 5m
                  failureStrategies:
                    - onFailure:
                        errors:
                          - AllErrors
                        action:
                          type: Abort
              - step:
                  type: Run
                  name: tofu Init
                  identifier: tofu_init_plan
                  spec:
                    connectorRef: account.harnessImage
                    image: ghcr.io/opentofu/opentofu:latest
                    shell: Sh
                    command: |
                      set -e
                      cd harness-platform-bootstrap

                      STATE_PREFIX="harness/platform_accelerator"
                      export STATE_PREFIX

                      tofu init \
                        -backend-config="bucket=<+pipeline.variables.s3_bucket>" \
                        -backend-config="key=${STATE_PREFIX}/terraform.tfstate" \
                        -backend-config="region=<+pipeline.variables.aws_region>"
                    envVariables:
                      AWS_ACCESS_KEY_ID: <+steps.aws_oidc_token_plan.output.outputVariables.AWS_ACCESS_KEY_ID>
                      AWS_SECRET_ACCESS_KEY: <+steps.aws_oidc_token_plan.output.outputVariables.AWS_SECRET_ACCESS_KEY>
                      AWS_SESSION_TOKEN: <+steps.aws_oidc_token_plan.output.outputVariables.AWS_SESSION_TOKEN>
                      TF_VAR_harness_platform_account: <+account.identifier>
                    outputVariables:
                      - name: STATE_PREFIX
                  timeout: 15m
                  failureStrategies:
                    - onFailure:
                        errors:
                          - AllErrors
                        action:
                          type: Abort
              - step:
                  type: Run
                  name: tofu Plan
                  identifier: tofu_plan_step
                  spec:
                    connectorRef: account.harnessImage
                    image: ghcr.io/opentofu/opentofu:latest
                    shell: Sh
                    command: |
                      set -e
                      cd harness-platform-bootstrap

                      export TF_VAR_git_connector_credentials=$(printf '%s' \
                        '{"platform_configs":{"http_credentials":{"github_app":{"application_id":"<+pipeline.variables.github_app_application_id>","installation_id":"<+pipeline.variables.github_app_installation_id>","private_key_ref":"<+pipeline.variables.github_app_private_key_ref>"}},"api_auth":{"github_app_api":true}}}')

                      if [ "<+pipeline.variables.tofu_action>" = "destroy" ]; then
                        tofu plan -destroy -out=tfplan
                      else
                        tofu plan -out=tfplan
                      fi
                    envVariables:
                      HARNESS_PLATFORM_API_KEY: <+secrets.getValue("harness_bootstrap_api_key")>
                      HARNESS_ACCOUNT_ID: <+account.identifier>
                      HARNESS_ENDPOINT: <+pipeline.variables.hanrness_platform_endpoint>
                      AWS_ACCESS_KEY_ID: <+steps.aws_oidc_token_plan.output.outputVariables.AWS_ACCESS_KEY_ID>
                      AWS_SECRET_ACCESS_KEY: <+steps.aws_oidc_token_plan.output.outputVariables.AWS_SECRET_ACCESS_KEY>
                      AWS_SESSION_TOKEN: <+steps.aws_oidc_token_plan.output.outputVariables.AWS_SESSION_TOKEN>
                      TF_VAR_harness_platform_account: <+account.identifier>
                      TF_VAR_organization_name: harness_platform_accelerator
                  timeout: 30m
                  failureStrategies:
                    - onFailure:
                        errors:
                          - AllErrors
                        action:
                          type: Abort
              - step:
                  type: Run
                  name: Upload Plan to S3
                  identifier: upload_plan
                  spec:
                    connectorRef: account.harnessImage
                    image: amazon/aws-cli:latest
                    shell: Sh
                    command: |
                      set -e

                      PLAN_FILE="/harness/harness-platform-bootstrap/tfplan"
                      if [ ! -f "$PLAN_FILE" ]; then
                        echo "ERROR: Plan file not found at $PLAN_FILE"
                        exit 1
                      fi

                      S3_BUCKET="<+pipeline.variables.s3_bucket>"
                      STATE_PREFIX="$STATE_PREFIX"
                      EXECUTION_ID="<+pipeline.executionId>"
                      PLAN_OBJECT="${STATE_PREFIX}/plans/${EXECUTION_ID}.tfplan"

                      echo "Uploading plan to s3://${S3_BUCKET}/${PLAN_OBJECT}"

                      aws s3 cp "$PLAN_FILE" "s3://${S3_BUCKET}/${PLAN_OBJECT}"

                      export PLAN_S3_PATH="s3://${S3_BUCKET}/${PLAN_OBJECT}"
                    envVariables:
                      AWS_ACCESS_KEY_ID: <+steps.aws_oidc_token_plan.output.outputVariables.AWS_ACCESS_KEY_ID>
                      AWS_SECRET_ACCESS_KEY: <+steps.aws_oidc_token_plan.output.outputVariables.AWS_SECRET_ACCESS_KEY>
                      AWS_SESSION_TOKEN: <+steps.aws_oidc_token_plan.output.outputVariables.AWS_SESSION_TOKEN>
                      AWS_DEFAULT_REGION: <+pipeline.variables.aws_region>
                      STATE_PREFIX: <+steps.tofu_init_plan.output.outputVariables.STATE_PREFIX>
                    outputVariables:
                      - name: PLAN_S3_PATH
                  timeout: 10m
                  failureStrategies:
                    - onFailure:
                        errors:
                          - AllErrors
                        action:
                          type: Abort
        failureStrategies:
          - onFailure:
              errors:
                - AllErrors
              action:
                type: Abort
    - stage:
        name: Approval
        identifier: approval_gate
        description: Manual approval required before bootstrap apply or destroy
        type: Approval
        spec:
          execution:
            steps:
              - step:
                  name: Approve Bootstrap Apply
                  identifier: approve_bootstrap_apply
                  type: HarnessApproval
                  timeout: 1d
                  spec:
                    approvalMessage: |-
                      Please review the tofu plan before proceeding.

                        Action       : <+pipeline.variables.tofu_action>
                        Scope        : Bootstrap (harness-platform-bootstrap)
                        Plan artifact: <+stages.bootstrap_plan.spec.execution.steps.upload_plan.output.outputVariables.PLAN_S3_PATH>

                      Review the plan output in Stage 1 (Bootstrap Plan) and approve only
                      if the changes are expected and safe to apply.
                    includePipelineExecutionHistory: true
                    approvers:
                      userGroups:
                        - _project_all_users
                        - account._account_all_users
                        - org._organization_all_users
                      minimumCount: 1
                      disallowPipelineExecutor: false
                    approverInputs: []
        when:
          pipelineStatus: Success
          condition: '<+pipeline.variables.tofu_action> != "plan"'
    - stage:
        name: Bootstrap Apply
        identifier: bootstrap_apply
        description: Download reviewed plan from S3 and apply
        type: CI
        spec:
          cloneCodebase: true
          caching:
            enabled: true
            override: true
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
          execution:
            steps:
              - step:
                  type: Plugin
                  name: AWS OIDC Token
                  identifier: aws_oidc_token_apply
                  spec:
                    connectorRef: account.harnessImage
                    image: plugins/aws-oidc
                    settings:
                      role_arn: <+pipeline.variables.aws_role_arn>
                      aws_region: <+pipeline.variables.aws_region>
                      duration: 3600
                  timeout: 5m
                  failureStrategies:
                    - onFailure:
                        errors:
                          - AllErrors
                        action:
                          type: Abort
              - step:
                  type: Run
                  name: tofu Init
                  identifier: tofu_init_apply
                  spec:
                    connectorRef: account.harnessImage
                    image: ghcr.io/opentofu/opentofu:latest
                    shell: Sh
                    command: |
                      set -e
                      cd /harness/harness-platform-bootstrap

                      tofu init \
                        -backend-config="bucket=<+pipeline.variables.s3_bucket>" \
                        -backend-config="key=harness/platform_accelerator/terraform.tfstate" \
                        -backend-config="region=<+pipeline.variables.aws_region>"
                    envVariables:
                      AWS_ACCESS_KEY_ID: <+steps.aws_oidc_token_apply.output.outputVariables.AWS_ACCESS_KEY_ID>
                      AWS_SECRET_ACCESS_KEY: <+steps.aws_oidc_token_apply.output.outputVariables.AWS_SECRET_ACCESS_KEY>
                      AWS_SESSION_TOKEN: <+steps.aws_oidc_token_apply.output.outputVariables.AWS_SESSION_TOKEN>
                      TF_VAR_harness_platform_account: <+account.identifier>
                  timeout: 15m
                  failureStrategies:
                    - onFailure:
                        errors:
                          - AllErrors
                        action:
                          type: Abort
              - step:
                  type: Run
                  name: Download Plan from S3
                  identifier: download_plan
                  spec:
                    connectorRef: account.harnessImage
                    image: amazon/aws-cli:latest
                    shell: Sh
                    command: |
                      set -e

                      S3_BUCKET="<+pipeline.variables.s3_bucket>"
                      STATE_PREFIX="harness/platform_accelerator"
                      EXECUTION_ID="<+pipeline.executionId>"
                      PLAN_OBJECT="${STATE_PREFIX}/plans/${EXECUTION_ID}.tfplan"
                      PLAN_FILE="/harness/harness-platform-bootstrap/tfplan"

                      echo "Downloading plan from s3://${S3_BUCKET}/${PLAN_OBJECT}"

                      aws s3 cp "s3://${S3_BUCKET}/${PLAN_OBJECT}" "$PLAN_FILE"

                      if [ ! -s "$PLAN_FILE" ]; then
                        echo "ERROR: Downloaded plan file is empty"
                        exit 1
                      fi

                      echo "Plan downloaded successfully ($(wc -c < "$PLAN_FILE") bytes)"
                    envVariables:
                      AWS_ACCESS_KEY_ID: <+steps.aws_oidc_token_apply.output.outputVariables.AWS_ACCESS_KEY_ID>
                      AWS_SECRET_ACCESS_KEY: <+steps.aws_oidc_token_apply.output.outputVariables.AWS_SECRET_ACCESS_KEY>
                      AWS_SESSION_TOKEN: <+steps.aws_oidc_token_apply.output.outputVariables.AWS_SESSION_TOKEN>
                      AWS_DEFAULT_REGION: <+pipeline.variables.aws_region>
                  timeout: 10m
                  failureStrategies:
                    - onFailure:
                        errors:
                          - AllErrors
                        action:
                          type: Abort
              - step:
                  type: Run
                  name: tofu Apply
                  identifier: tofu_apply_step
                  spec:
                    connectorRef: account.harnessImage
                    image: ghcr.io/opentofu/opentofu:latest
                    shell: Sh
                    command: |
                      set -e
                      cd /harness/harness-platform-bootstrap

                      export TF_VAR_git_connector_credentials=$(printf '%s' \
                        '{"platform_configs":{"http_credentials":{"github_app":{"application_id":"<+pipeline.variables.github_app_application_id>","installation_id":"<+pipeline.variables.github_app_installation_id>","private_key_ref":"<+pipeline.variables.github_app_private_key_ref>"}},"api_auth":{"github_app_api":true}}}')

                      # Apply the exact plan that was reviewed
                      tofu apply -auto-approve tfplan
                    envVariables:
                      HARNESS_PLATFORM_API_KEY: <+secrets.getValue("harness_bootstrap_api_key")>
                      HARNESS_ENDPOINT: <+pipeline.variables.hanrness_platform_endpoint>
                      HARNESS_ACCOUNT_ID: <+account.identifier>
                      AWS_ACCESS_KEY_ID: <+steps.aws_oidc_token_apply.output.outputVariables.AWS_ACCESS_KEY_ID>
                      AWS_SECRET_ACCESS_KEY: <+steps.aws_oidc_token_apply.output.outputVariables.AWS_SECRET_ACCESS_KEY>
                      AWS_SESSION_TOKEN: <+steps.aws_oidc_token_apply.output.outputVariables.AWS_SESSION_TOKEN>
                      TF_VAR_harness_platform_account: <+account.identifier>
                      TF_VAR_organization_name: harness_platform_accelerator
                  timeout: 60m
                  failureStrategies:
                    - onFailure:
                        errors:
                          - AllErrors
                        action:
                          type: Abort
        when:
          pipelineStatus: Success
          condition: '<+pipeline.variables.tofu_action> != "plan"'
        failureStrategies:
          - onFailure:
              errors:
                - AllErrors
              action:
                type: Abort
